name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 26.1.0

jobs:
  quality:
    name: Quality gate (fmt, clippy, test, docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt

      - name: Clippy
        run: make lint

      - name: Test
        run: make test

      - name: Rustdoc
        run: make docs-check

  build:
    name: Contract build + WASM hash gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f src/lib.rs
          test -f README.md
          test -f Makefile

      # Issue #402: fails if the ContractError discriminants drift apart across
      # src/error.rs, from_code, abi/contract_error_codes.golden and
      # docs/ABI.md, or if a discriminant is reused. Cheap and dependency-free,
      # so it runs before the build rather than after it.
      - name: Check ABI error-code consistency
        run: ./scripts/check_error_codes.sh

      # Issue #399: the reference indexer classifies event topics from a table
      # that has to stay in step with src/events.rs.
      - name: Check event indexer topic table
        run: ./scripts/check_event_topics.sh
